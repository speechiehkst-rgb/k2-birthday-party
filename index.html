/* Layout: one party room that fills up as children read. Question panel (picture + stacked word cards) beside the room on tablets, stacked on phones. */
:root{
  --bg:#fffff2; --paper:#ffffff; --ink:#3d2c2c; --soft:#7a6060; --line:#f9c4d0;
  --pink:#ff6b9d; --red:#e74c3c; --sun:#fff9e6; --blush:#fff0f3;
  --good:#7cb342; --good-bg:#e8f5d0; --wall:#fdf1dc; --floor:#e9c99a; --wood:#c98b5a;
  --kai:"Free HK Kai","Kaiti TC","BiauKai","DFKai-SB","STKaiti",serif;
  --r:20px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--kai);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}

/* Top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;justify-content:space-between}
.stages{display:flex;gap:8px;flex-wrap:wrap;align-items:center;list-style:none;margin:0;padding:0}
.stage{display:flex;align-items:center;gap:4px;height:50px;padding:0 12px 0 4px;border-radius:26px;background:var(--paper);border:2px solid var(--line);font-size:19px;color:var(--soft);transition:.3s}
.stage img{width:40px;height:40px;object-fit:contain}
.stage .nm{white-space:nowrap}
.stage.now{border-color:var(--pink);background:var(--blush);color:var(--ink);box-shadow:0 0 0 3px rgba(255,107,157,.2)}
.stage.done{border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.stage .num{font-size:20px;min-width:1.2em;text-align:center}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;font-size:22px;min-height:52px;padding:0 16px;border-radius:12px}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1;border:0;border-radius:16px;min-height:60px;padding:0 22px;font-size:24px;background:var(--paper);border:2px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.main{background:var(--red);border-color:var(--red);color:#fff;font-size:30px;min-height:72px;padding:0 34px}
.btn.icon{width:60px;padding:0;font-size:26px}

/* Main */
.play{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--paper);border-radius:28px;padding:20px;box-shadow:0 4px 14px rgba(120,60,60,.08);display:flex;flex-direction:column;gap:14px;position:relative}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prompt{font-size:30px;line-height:1.35;margin:0;text-wrap:balance}
.count{font-size:22px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.qbody{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center}
.pic{background:var(--sun);border-radius:24px;aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden;max-width:100%}
.pic img{width:92%;height:92%;object-fit:contain}
.pic.party img{width:100%;height:100%;border-radius:24px;object-fit:cover}
.cards{display:flex;flex-direction:column;gap:14px;container-type:inline-size}
.card{width:100%;min-height:104px;border-radius:22px;background:var(--paper);border:3px solid #e5d6cc;box-shadow:0 5px 0 #e5d6cc;
  font-family:var(--kai);font-size:clamp(34px,20cqi,64px);line-height:1;letter-spacing:.06em;padding:10px 8px;position:relative;transition:transform .12s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #e5d6cc}
.card.right{border-color:var(--good);box-shadow:0 0 0 4px var(--good),0 6px 18px rgba(124,179,66,.35);background:var(--good-bg)}
.card.right::after{content:"✓";position:absolute;right:12px;top:8px;font-size:30px;color:var(--good);font-family:system-ui,sans-serif}
.card.wob{animation:wob .45s}
.card.fade{opacity:.45}
@keyframes wob{20%{transform:translateX(-8px) rotate(-2deg)}45%{transform:translateX(7px) rotate(2deg)}70%{transform:translateX(-4px)}100%{transform:none}}
.hint{position:absolute;left:50%;bottom:14px;transform:translate(-50%,-6px);background:var(--paper);border:3px solid var(--pink);border-radius:20px;padding:8px 20px;font-size:28px;z-index:2;box-shadow:0 4px 10px rgba(0,0,0,.08);opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.hint.show{opacity:1;transform:translate(-50%,0)}
.after{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:72px}
.yay{font-size:30px;color:var(--good)}

/* Scene */
.scene{position:relative;aspect-ratio:16/11;max-width:100%;border-radius:28px;overflow:hidden;background:linear-gradient(var(--wall) 0 70%,var(--floor) 70% 100%);box-shadow:inset 0 0 0 3px #f2dcc0}
.scene .wallpaper{position:absolute;inset:0 0 30% 0;background:radial-gradient(circle,rgba(255,107,157,.12) 2.2px,transparent 2.6px) 0 0/26px 26px}
.scene .skirt{position:absolute;left:0;right:0;top:69%;height:2.2%;background:#d9a874}
.scene svg.bunting{position:absolute;left:0;top:0;width:100%;height:16%}
.door{position:absolute;left:3%;top:24%;width:19%;height:47%;background:#b57a4c;border-radius:14px 14px 0 0;box-shadow:inset 0 0 0 5px #9c6239}
.door::after{content:"";position:absolute;right:12%;top:52%;width:9%;aspect-ratio:1;border-radius:50%;background:#f4c542}
.rail{position:absolute;left:25.5%;width:37%;top:22%;height:2%;background:var(--wood);border-radius:6px}
.frame{position:absolute;left:66%;top:16%;width:30%;aspect-ratio:1;border-radius:12px;background:#fffdf7;box-shadow:inset 0 0 0 6px #e8b86a}
.slot{position:absolute;border:3px dashed rgba(201,139,90,.45);border-radius:16px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.4);transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1);
  filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 4px rgba(90,50,30,.25))}
.slot.on{border-color:transparent}
.slot.on img{opacity:1;transform:none}
.slot.frameSlot img{border-radius:8px;filter:none;inset:6%;width:88%;height:88%;object-fit:cover}
.s-hat{left:26.5%;top:24%;width:10.5%;height:13%}
.s-scarf{left:38.5%;top:24%;width:10.5%;height:15%}
.s-gloves{left:50.5%;top:24%;width:11%;height:13%}
.s-who{left:5.5%;top:27%;width:14%;height:42%}
.s-jiejie{left:27%;top:47%;width:16%;height:46%}
.s-didi{left:41.5%;top:55%;width:14%;height:38%}
.s-gift{left:79%;top:73%;width:15%;height:23%}
.s-party{left:66%;top:16%;width:30%;height:43.6%;border:0}

.foot{text-align:center;color:#a99;font-size:14px;font-family:system-ui,sans-serif;margin-top:auto;padding-top:6px}

/* Cover + finale */
.overlay{position:fixed;inset:0;background:rgba(255,255,242,.97);display:flex;z-index:20;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{margin:auto;width:min(860px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.sheet h1{font-size:clamp(36px,7vw,64px);margin:0;color:var(--red);font-weight:400;letter-spacing:.06em;text-wrap:balance}
.sheet p{font-size:24px;margin:0;color:var(--soft)}
.cover-pics{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cover-pics img{width:clamp(64px,12vw,104px);aspect-ratio:1;object-fit:contain;background:var(--paper);border-radius:20px;padding:6px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.sheet .seg button{font-size:26px;min-height:60px;padding:0 22px}
.finale-scene{width:min(100%,max(300px,calc((100vh - 400px)*16/11)))}
.finale-scene .scene{width:100%}
.say{display:flex;gap:6px;justify-content:center}
.say span{font-size:clamp(56px,11vw,104px);line-height:1.1;padding:4px 10px;border-radius:18px;transition:.25s;color:var(--ink)}
.say span.lit{background:var(--sun);color:var(--red);transform:scale(1.12)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.flyer{position:fixed;z-index:25;pointer-events:none;object-fit:contain}

@media (max-width:980px){
  .play{grid-template-columns:1fr}
  .stage .nm{display:none}
  .stage.done .nm,.stage.now .nm{display:none}
}
@media (max-width:560px){
  .qbody{grid-template-columns:1fr}
  .pic{width:min(100%,320px);justify-self:center}
  .prompt{font-size:26px}
  .stage{height:44px;padding:0 8px 0 4px}
  .stage img{width:32px;height:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <div class="bar">
    <ol class="stages" id="stages" aria-label="進度"></ol>
    <div class="tools">
      <div class="seg" role="group" aria-label="難度">
        <button type="button" data-n="2">兩個選項</button>
        <button type="button" data-n="3">三個選項</button>
      </div>
      <button type="button" class="btn icon" id="sound" aria-label="聲音開關">🔊</button>
      <button type="button" class="btn" id="restart">重新開始</button>
    </div>
  </div>

  <div class="play">
    <section class="panel" aria-live="polite">
      <div class="qhead"><p class="prompt" id="prompt"></p><span class="count" id="count"></span></div>
      <div class="qbody">
        <div class="pic" id="pic"><img id="qimg" alt=""><div class="hint" id="hint">再試一次 🙂</div></div>
        <div class="cards" id="cards"></div>
      </div>

};
const STAGES = [
  {name:'準備衣物', icon:'s_hat'},
  {name:'帶禮物',   icon:'s_gift'},
  {name:'開門迎賓', icon:'s_who'},
  {name:'認識姊弟', icon:'s_jiejie'},
  {name:'生日祝福', icon:'party'}
];
/* 提示句不含任何目標字，避免孩子從句子中找到答案 */
const QUESTIONS = [
  {word:'帽子', img:'hat',    slot:'hat',    stage:0, prompt:'天氣冷，出門前頭上要戴……', near:['圍巾','手套']},
  {word:'圍巾', img:'scarf',  slot:'scarf',  stage:0, prompt:'頸上還要繞一條……',         near:['帽子','手套']},
  {word:'手套', img:'gloves', slot:'gloves', stage:0, prompt:'最後還要戴上一雙……',       near:['帽子','圍巾']},
  {word:'禮物', img:'gift',   slot:'gift',   stage:1, prompt:'去派對，要帶上……',         near:[]},
  {word:'誰',   img:'who',    slot:'who',    stage:2, prompt:'叮咚！門鈴響了，門外是……？', near:[]},
  {word:'弟弟', img:'didi',   slot:'didi',   stage:3, prompt:'看看箭嘴，這是……',         near:['姐姐']},
  {word:'姐姐', img:'jiejie', slot:'jiejie', stage:3, prompt:'看看箭嘴，這是……',         near:['弟弟']},
  {word:'生日快樂', img:'party', slot:'party', stage:4, prompt:'蛋糕來了！大家一起說……', near:[]}
];
const WORDS = QUESTIONS.map(q=>q.word);
const SLOTS = {hat:'s_hat',scarf:'s_scarf',gloves:'s_gloves',gift:'s_gift',who:'s_who',didi:'s_didi',jiejie:'s_jiejie',party:'party'};

const $ = s=>document.querySelector(s);
let state = {i:0, n:DEFAULT_OPTIONS, solved:false, options:[], done:[]};
let soundOn = true;

/* ---- scene setup ---- */
(function buildScene(){
  const cols=['#ff9eb8','#ffd36b','#9fd3f0','#b6e08a','#d7b4f3'];
  let g='';for(let k=0;k<16;k++){const x=k*10;const y=3+9*Math.sin(Math.PI*(x+5)/160)*0.95;
    g+=`<path d="M${x+1} ${(3+9*Math.sin(Math.PI*x/160)).toFixed(2)} L${x+9} ${(3+9*Math.sin(Math.PI*(x+10)/160)).toFixed(2)} L${x+5} ${(y+7).toFixed(2)}Z" fill="${cols[k%5]}"/>`;}
  $('#flags').innerHTML=g;
  const sc=$('#scene');
  for(const [slot,src] of Object.entries(SLOTS)){
    const d=document.createElement('div');d.className='slot s-'+slot+(slot==='party'?' frameSlot':'');d.dataset.slot=slot;
    d.innerHTML=`<img src="${IMG[src]}" alt="">`;sc.appendChild(d);
  }
})();

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickOptions(q,n){
  const pool=shuffle(WORDS.filter(w=>w!==q.word));
  const near=shuffle(q.near);
  const ds=[];
  for(const w of near.concat(pool)){ if(ds.length>=n-1)break; if(!ds.includes(w))ds.push(w); }
  return shuffle([q.word,...ds]);
}

function renderStages(){
  const cur=QUESTIONS[Math.min(state.i,7)].stage;
  $('#stages').innerHTML=STAGES.map((s,k)=>{
    const done=QUESTIONS.filter(q=>q.stage===k).every(q=>state.done.includes(q.word));
    const cls=done?'done':(k===cur?'now':'');
    /* 站名包含目標字（如「帶禮物」「生日祝福」），完成該站後才顯示站名 */
    return `<li class="stage ${cls}" aria-label="第${k+1}站"><img src="${IMG[s.icon]}" alt="">${done?`<span class="nm">✓ ${s.name}</span>`:`<span class="num">${k+1}</span>`}</li>`;
  }).join('');
}

function renderQuestion(keepOptions){
  const q=QUESTIONS[state.i];
  state.solved=false;
  if(!keepOptions) state.options=pickOptions(q,state.n);
  $('#prompt').textContent=q.prompt;
  $('#count').textContent=`${state.i+1} / ${QUESTIONS.length}`;
  $('#pic').className='pic'+(q.img==='party'?' party':'');
  $('#qimg').src=IMG[q.img];
  $('#cards').innerHTML=state.options.map(w=>`<button type="button" class="card" data-w="${w}">${w}</button>`).join('');
  $('#after').innerHTML='';
  renderStages();
}

function onPick(btn){
  if(state.solved)return;
  const q=QUESTIONS[state.i];
  if(btn.dataset.w===q.word){
    state.solved=true;state.done.push(q.word);
    btn.classList.add('right');
    document.querySelectorAll('.card').forEach(b=>{if(b!==btn)b.classList.add('fade')});
    tone([660,880,1100]);
    flyToScene(q);
    renderStages();
    const last=state.i===QUESTIONS.length-1;
    $('#after').innerHTML=`<span class="yay">答對了！</span>
      <button type="button" class="btn" id="read">🔈 讀一讀</button>
      <button type="button" class="btn main" id="next">${last?'看看生日會':'下一題 ➜'}</button>`;
    $('#read').onclick=()=>speak(q.word);
    $('#next').onclick=()=>{ if(last) showFinale(); else {state.i++;renderQuestion();} };
  }else{
    btn.classList.remove('wob');void btn.offsetWidth;btn.classList.add('wob');
    tone([392,349],.12);
    const h=$('#hint');h.classList.add('show');clearTimeout(h._t);h._t=setTimeout(()=>h.classList.remove('show'),1300);
  }
}

function flyToScene(q){
  const slot=document.querySelector(`#scene .slot[data-slot="${q.slot}"]`);
  const from=$('#qimg').getBoundingClientRect(), to=slot.getBoundingClientRect();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||!from.width||!to.width||!document.body.animate){slot.classList.add('on');return;}
  const f=document.createElement('img');f.className='flyer';f.src=$('#qimg').src;
  Object.assign(f.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'});
  document.body.appendChild(f);
  const dx=to.left+to.width/2-(from.left+from.width/2), dy=to.top+to.height/2-(from.top+from.height/2);
  const s=Math.min(to.width/from.width,to.height/from.height);
  f.animate([{transform:'none',opacity:1},{transform:`translate(${dx*0.5}px,${dy*0.5-80}px) scale(${(1+s)/2})`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${s})`,opacity:.2}],
    {duration:800,easing:'ease-in-out'}).onfinish=()=>{f.remove();slot.classList.add('on');sparkle(to);};
}

/* ---- finale ---- */
function showFinale(){
  const box=$('#finaleScene');box.innerHTML='';
  const clone=$('#scene').cloneNode(true);clone.removeAttribute('id');box.appendChild(clone);
  $('#finale').hidden=false;
  confetti();tone([523,659,784,1047]);
}
let chorusBusy=false;
function chorus(){
  if(chorusBusy)return;chorusBusy=true;
  const sp=[...document.querySelectorAll('#say span')];
  sp.forEach(s=>s.classList.remove('lit'));
  sp.forEach((s,k)=>setTimeout(()=>{s.classList.add('lit');tone([523+k*90],.18);},k*CHORUS_STEP_MS));
  setTimeout(()=>{confetti();chorusBusy=false;},sp.length*CHORUS_STEP_MS);
}

function restart(){
  state={i:0,n:state.n,solved:false,options:[],done:[]};
  document.querySelectorAll('#scene .slot').forEach(s=>s.classList.remove('on'));
  $('#finale').hidden=true;$('#finaleScene').innerHTML='';
  document.querySelectorAll('#say span').forEach(s=>s.classList.remove('lit'));
  renderQuestion();
}

function setN(n){
  state.n=n;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.n===n)));
  if(!state.solved && $('#cover').hidden) renderQuestion();
}

/* ---- sound ---- */
let ac=null;
function tone(freqs,dur=.16){
  if(!soundOn)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
      const t=ac.currentTime+k*dur*0.8;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur*1.7);});
  }catch(e){}
}
function speak(text){
  try{ if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(String(text));u.lang=SPEECH_LANG;u.rate=.8;
    speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

/* ---- effects ---- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function fxLoop(){
  cv.width=innerWidth;cv.height=innerHeight;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;p.rot+=p.vr;
    cx.save();cx.globalAlpha=Math.min(1,p.life/30);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.star){cx.beginPath();for(let k=0;k<5;k++){cx.lineTo(Math.cos((18+k*72)*Math.PI/180)*p.s,-Math.sin((18+k*72)*Math.PI/180)*p.s);cx.lineTo(Math.cos((54+k*72)*Math.PI/180)*p.s*.45,-Math.sin((54+k*72)*Math.PI/180)*p.s*.45);}cx.fill();}
    else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cx.restore();}
  raf=parts.length?requestAnimationFrame(fxLoop):0;
}
const COLS=['#ff6b9d','#ffd36b','#7cb342','#9fd3f0','#e74c3c','#d7b4f3'];
function sparkle(r){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let k=0;k<18;k++){const a=Math.random()*Math.PI*2,v=2+Math.random()*3;
    parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.05,life:45,s:9,c:COLS[k%6],star:true,rot:0,vr:.1});}
  if(!raf)fxLoop();
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let k=0;k<140;k++){parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.03,life:200,s:10+Math.random()*8,c:COLS[k%6],star:k%5===0,rot:Math.random()*6,vr:(Math.random()-.5)*.2});}
  if(!raf)fxLoop();
}

/* ---- wiring ---- */
$('#cards').addEventListener('click',e=>{const b=e.target.closest('.card');if(b)onPick(b);});
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setN(+b.dataset.n)));
$('#start').onclick=()=>{$('#cover').hidden=true;tone([523,784]);renderQuestion();};
$('#restart').onclick=restart;
$('#again').onclick=restart;
$('#chorus').onclick=chorus;
$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊':'🔇';};
setN(DEFAULT_OPTIONS);
renderQuestion();
</script>
</body></html>
